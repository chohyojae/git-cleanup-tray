# SPDX-License-Identifier: GPL-3.0-only
# cargo deny check 설정. 새 dependency는 GPL-3.0-only 배포와 호환되어야 한다.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# RUSTSEC 보안 권고와 unmaintained crate를 모두 확인한다.
unmaintained = "all"
yanked = "deny"

[licenses]
# GPLv3와 호환되는 permissive license만 허용한다.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# PLAN 2.4장: WebView 기반 UI는 사용하지 않는다.
deny = [
    { crate = "wry" },
    { crate = "webview2-com" },
    { crate = "tauri" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
