# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "git-cleanup-tray"
version = "0.1.0"
edition = "2024"
# slint 1.18.1의 MSRV가 1.92이므로 그보다 낮출 수 없다.
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Tray-first utility that safely cleans merged local branches, worktrees and refs/remote/* refs"
publish = false
build = "build.rs"

[lib]
name = "git_cleanup_tray"
path = "src/lib.rs"

[[bin]]
name = "git-cleanup-tray"
path = "src/main.rs"

[dependencies]
# GUI. default feature는 OpenGL renderer(femtovg)까지 켜므로 끄고 필요한 것만 고른다.
# - renderer-software: GPU context를 만들지 않아 상주 메모리가 작다. 작은 utility 창에는 충분하다.
# - accessibility: PLAN 23장(screen reader 지원) 요구사항.
# - system-tray: SystemTrayIcon element.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    # 탐색기/Finder에서 놓은 폴더를 창 이벤트로 받는다.
    "unstable-winit-030",
    "renderer-software",
    "accessibility",
    "system-tray",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# release build에서는 debug/trace 로그 호출을 compile time에 제거한다.
log = { version = "0.4.35", features = ["release_max_level_info"] }
# regex/color/humantime 의존성을 피하기 위해 default feature를 끈다.
env_logger = { version = "0.11.11", default-features = false }
dirs = "7.0.0"
# 저장소 추가 시 OS native 폴더 선택 창. default feature(xdg-portal, wayland)는 Linux 전용이라 끈다.
rfd = { version = "0.17.2", default-features = false }
# 로컬 조회만 사용하고 저장소별 동시 실행 수는 앱이 관리한다.
gix = { version = "0.90.0", default-features = false, features = [
    "revision",
    "status",
    "sha1",
    "sha256",
    "pack-cache-lru-static",
] }

[target.'cfg(windows)'.dependencies]
# login 자동 시작용 `HKCU\...\Run` registry 값 읽기/쓰기. 다른 feature는 쓰지 않는다.
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# "모든 함수·타입에 주석" 규칙을 private item까지 강제한다.
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# 한글 조사가 붙은 식별자(예: "SQLite로")를 오탐하므로 끈다. 식별자는 직접 backtick으로 감싼다.
doc_markdown = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort"는 쓰지 않는다. worker thread의 panic을 잡아 오류로 보고해야
# tray process가 함께 죽지 않는다.

# 메모리 profiling용. release 최적화에 symbol만 남긴다.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = "thin"
